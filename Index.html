<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Urooz's Chatbot 🤖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .chat-container {
      width: 360px;
      height: 520px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      background: rgba(0,0,0,0.3);
    }

    .chat-header span {
      font-size: 12px;
      display: block;
      opacity: 0.8;
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 14px;
      animation: fadeIn 0.3s ease;
    }

    .user {
      background: #4facfe;
      color: black;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: rgba(255,255,255,0.2);
      border-bottom-left-radius: 4px;
    }

    .typing {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-input {
      display: flex;
      padding: 10px;
      background: rgba(0,0,0,0.3);
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    button {
      margin-left: 8px;
      border: none;
      background: #4facfe;
      padding: 10px 16px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #00f2fe;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    🤖 Urooz's Chatbot
    <span>Built by Urooz Manzar</span>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="msg bot">
      Hey 👋 I’m Urooz’s personal AI. Ask me anything 😌
    </div>
  </div>

  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type your message..." />
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const chatBox = document.getElementById("chatBox");
const input = document.getElementById("userInput");

// 🧠 KNOWLEDGE BASE
const knowledgeBase = [
  {
    keywords: ["hi", "hello", "hey"],
    replies: [
      "Heyyy 👋 How are you?",
      "Hello 😄 nice to see you!",
      "Hi there! What’s up? 👀"
    ]
  },
  {
    keywords: ["how are you"],
    replies: [
      "I’m doing great 😌 thanks for asking!",
      "All good 🚀 what about you?",
      "Feeling awesome today 😄"
    ]
  },
  {
    keywords: ["your name"],
    replies: [
      "I’m Urooz’s Chatbot 🤖",
      "You can call me Urooz AI 😎"
    ]
  },
  {
    keywords: ["who made you", "creator", "owner"],
    replies: [
      "Built by Urooz Manzar 😌",
      "Created by a smart guy named Urooz 😎"
    ]
  },
  {
    keywords: ["date"],
    replies: [
      "Haha smooth 😏",
      "Depends… coffee or ice cream? ☕🍦",
      "First tell me your favorite song 🎵"
    ]
  },
  {
    keywords: ["love"],
    replies: [
      "Love is complicated… coding isn’t 😌",
      "Love + respect = perfect combo ❤️"
    ]
  },
  {
    keywords: ["study", "exam"],
    replies: [
      "Study hard now, flex later 📚🔥",
      "Exams don’t last forever, knowledge does 💡"
    ]
  },
  {
    keywords: ["school"],
    replies: [
      "School life = memories + pressure 😄",
      "School teaches lessons beyond books 🎒"
    ]
  },
  {
    keywords: ["friend"],
    replies: [
      "Friends make life better 💙",
      "Good friends = real wealth 😌"
    ]
  },
  {
    keywords: ["bye", "goodbye"],
    replies: [
      "Bye 👋 talk soon!",
      "See you later 😄"
    ]
  }
];

// SEND MESSAGE
function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  showTyping();

  setTimeout(() => {
    removeTyping();
    addMessage(getBotReply(text), "bot");
  }, 800);
}

// GET BOT REPLY
function getBotReply(msg) {
  msg = msg.toLowerCase();

  for (let item of knowledgeBase) {
    for (let word of item.keywords) {
      if (msg.includes(word)) {
        return randomReply(item.replies);
      }
    }
  }

  return randomReply([
    "Hmm interesting 👀 tell me more...",
    "Ohh 😯 that sounds cool",
    "I see 👂 go on...",
    "That’s nice 😌"
  ]);
}

// HELPERS
function randomReply(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function addMessage(text, sender) {
  const msg = document.createElement("div");
  msg.className = "msg " + sender;
  msg.innerText = text;
  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping() {
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.id = "typing";
  typing.innerText = "Urooz's Bot is typing...";
  chatBox.appendChild(typing);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function removeTyping() {
  const typing = document.getElementById("typing");
  if (typing) typing.remove();
}

input.addEventListener("keypress", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
